<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Relojes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white font-sans antialiased selection:bg-white selection:text-black">

    <!-- Encabezado Estilo Minimalista (Negro y Gris) -->
    <header class="bg-black border-b border-neutral-800 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
        <div class="max-w-7xl mx-auto px-6 py-5 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-light tracking-[0.2em] uppercase flex items-center gap-3 text-white">
                <i class="fa-solid fa-clock text-neutral-400"></i> Catálogo de Relojes
            </h1>
            <!-- Buscador Minimalista -->
            <div class="w-full md:w-80 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-neutral-500">
                    <i class="fa-solid fa-search text-sm"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Buscar modelo o categoría..." 
                    class="w-full pl-10 pr-4 py-2 bg-neutral-900 border border-neutral-800 rounded-none focus:outline-none focus:border-white text-sm text-white placeholder-neutral-500 transition duration-200">
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-6 py-12">
        
        <!-- Mensaje de Carga -->
        <div id="loading" class="text-center py-32">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-neutral-400 mb-4"></i>
            <p class="text-neutral-500 text-sm tracking-widest uppercase">Cargando colección...</p>
        </div>

        <!-- Contenedor de Productos -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 hidden">
            <!-- Los productos se inyectarán aquí -->
        </div>

        <!-- Mensaje si no hay resultados -->
        <div id="noResults" class="text-center py-32 hidden">
            <p class="text-neutral-500 text-sm tracking-widest">No se encontraron relojes disponibles.</p>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-black border-t border-neutral-900 text-center py-8 mt-20 text-xs text-neutral-600 tracking-wider">
        <p>&copy; 2026 CATÁLOGO DE RELOJES. TODOS LOS DERECHOS RESERVADOS.</p>
    </footer>

    <!-- Librería PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // ⚠️ PEGA AQUÍ TU ENLACE CSV DE GOOGLE SHEETS ENTRE COMILLAS
        const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSbHlNVFQd1-PmrP7QUUfdWThmZkYL6OgK5g1aYOtP4YSffYgaqwOurwm0so64v6KGrIe3cPUMCzJpU/pub?output=csv'; 
        
        let allProducts = [];

        function cargarRelojes() {
            if (SPREADSHEET_CSV_URL.includes('PEGA_AQUI')) {
                document.getElementById('loading').innerHTML = `
                    <div class="bg-neutral-900 border border-neutral-800 p-8 max-w-md mx-auto text-left">
                        <h3 class="text-white font-medium mb-2 tracking-wide"><i class="fa-solid fa-triangle-exclamation text-neutral-400"></i> Falta configurar el enlace</h3>
                        <p class="text-xs text-neutral-400 leading-relaxed">Edita el archivo <code>index.html</code> en GitHub y reemplaza <code>PEGA_AQUI_EL_ENLACE_CSV_DE_TU_GOOGLE_SHEET</code> con tu enlace de Google Sheets.</p>
                    </div>`;
                return;
            }

            Papa.parse(SPREADSHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    allProducts = results.data.filter(item => item.nombre && item.nombre.trim() !== "");
                    document.getElementById('loading').classList.add('hidden');
                    renderProducts(allProducts);
                },
                error: function(err) {
                    document.getElementById('loading').innerHTML = `<p class="text-neutral-400 text-sm">Error al cargar los datos. Verifica el enlace de Google Sheets.</p>`;
                }
            });
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            if (products.length === 0) {
                noResults.classList.remove('hidden');
                grid.classList.add('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.classList.remove('hidden');

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-neutral-950 border border-neutral-800 overflow-hidden flex flex-col justify-between group hover:border-neutral-500 transition duration-300";
                
                const mensajeWp = encodeURIComponent(`Hola, estoy interesado en el reloj: ${p.nombre} (${p.precio})`);
                const telefonoWp = p.whatsapp ? p.whatsapp.trim() : ''; 
                const linkWp = telefonoWp ? `https://wa.me/${telefonoWp}?text=${mensajeWp}` : `#`;

                card.innerHTML = `
                    <div>
                        <div class="h-72 bg-neutral-900 overflow-hidden relative border-b border-neutral-900">
                            <img src="${p.imagen && p.imagen.trim() !== '' ? p.imagen : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60'}" 
                                 alt="${p.nombre}" 
                                 class="w-full h-full object-cover opacity-90 group-hover:opacity-100 group-hover:scale-105 transition duration-500">
                            <span class="absolute top-3 right-3 bg-black/80 backdrop-blur-sm text-neutral-300 text-[10px] tracking-widest font-light px-3 py-1 uppercase border border-neutral-800">${p.categoria || 'Reloj'}</span>
                        </div>
                        <div class="p-6">
                            <h3 class="text-base font-normal tracking-wide text-white mb-2">${p.nombre}</h3>
                            <p class="text-neutral-200 font-medium text-lg mb-3">$${Number(p.precio || 0).toLocaleString('es-CO')}</p>
                            <p class="text-neutral-400 text-xs leading-relaxed line-clamp-3 mb-6">${p.descripcion || 'Sin descripción disponible.'}</p>
                        </div>
                    </div>
                    <div class="p-6 pt-0">
                        <a href="${linkWp}" target="_blank" class="w-full bg-white hover:bg-neutral-200 text-black font-medium tracking-wider py-2.5 px-4 flex items-center justify-center gap-2 transition duration-200 text-xs uppercase">
                            <i class="fa-brands fa-whatsapp text-sm"></i> Consultar
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => 
                (p.nombre && p.nombre.toLowerCase().includes(term)) || 
                (p.categoria && p.categoria.toLowerCase().includes(term))
            );
            renderProducts(filtered);
        });

        cargarRelojes();
    </script>
</body>
</html>
